version: '3'

services:
    nas-tools:
        restart: unless-stopped
        network_mode: bridge
        hostname: nas-tools
        container_name: nas-tools
        image: zp29/nas-tools:latest
        ports:
            - 3001:3000        # 默认的webui控制端口
        volumes:
            - ../nastoolsconfig:/config   # 冒号左边请修改为你想保存配置的路径
            # - /Volumes/:/UNas
            - /Users/a29/mount/alist:/mount
            - /Users/a29/Downloads/LocMedia/link:/link
        environment: 
            - PUID=0    # 想切换为哪个用户来运行程序，该用户的uid
            - PGID=0    # 想切换为哪个用户来运行程序，该用户的gid
            - UMASK=000 # 掩码权限，默认000，可以考虑设置为022
            - NASTOOL_AUTO_UPDATE=false  # 如需在启动容器时自动升级程程序请设置为true
            - NASTOOL_CN_UPDATE=false # 如果开启了容器启动自动升级程序，并且网络不太友好时，可以设置为true
            - TZ=Asia/Shanghai # 时区
        extra_hosts:
            - "host.docker.internal:host-gateway"

networks:
    default:
    moviepilot:
        name: moviepilot
